[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-context-cache"
version = "0.1.0"
description = "Cache Claude topic contexts, auto-compact, and emit ≤750-word handoff documents for the next context window."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Claude Context Cache" }]
dependencies = [
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
redis = ["redis>=5.0"]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
mongodb = ["pymongo>=4.6"]
tui = ["textual>=0.79"]
all-stores = [
    "redis>=5.0",
    "pymysql>=1.1",
    "psycopg[binary]>=3.1",
    "pymongo>=4.6",
]

[project.scripts]
ccc = "ccc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccc = ["py.typed"]
